name: update sr provider api data

on:
  schedule:
    - cron: '0 10 * * 1'  # runs every monday at 10:00 UTC
  workflow_dispatch:      # allows manual trigger

jobs:
  update-tvl:
    runs-on: fixed-egress-4c-16g
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: Fetch data from finance repository
        run: |
          curl -H "Authorization: token ${{ secrets.GH_PAT_FINANCE }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L https://api.github.com/repos/kilnfi/finance-scripts/contents/src/staking_rewards/data.json \
               -o provider_api/data.json

      - name: commit and open pull request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FINANCE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- provider_api/data.json; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="automated/update-sr-provider-api-data"
          git checkout -B "$BRANCH"
          git add provider_api/data.json
          git commit -m "automated: update sr provider api data"
          git push -f origin "$BRANCH"

          gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q . || \
          gh pr create \
            --title "automated: update sr provider api data" \
            --body "Automated weekly refresh of the Staking Rewards provider API data." \
            --base main \
            --head "$BRANCH"
