name: update sr provider api data

on:
  schedule:
    - cron: '0 10 * * 1'  # runs every monday at 10:00 UTC
  workflow_dispatch:      # allows manual trigger

jobs:
  update-tvl:
    runs-on: fixed-egress-8c-32g
    permissions:
      contents: write
      pull-requests: write
    env:
      FILE_PATH: provider_api/data.json

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: generate finance-scripts read token
        id: finance-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FINANCE_READER_APP_ID }}
          private-key: ${{ secrets.FINANCE_READER_APP_PRIVATE_KEY }}
          owner: kilnfi
          repositories: finance-scripts

      - name: Fetch data from finance repository
        env:
          FINANCE_TOKEN: ${{ steps.finance-app-token.outputs.token }}
        run: |
          curl -H "Authorization: token $FINANCE_TOKEN" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L https://api.github.com/repos/kilnfi/finance-scripts/contents/src/staking_rewards/data.json \
               -o "$FILE_PATH"

      - name: commit and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: automated/update-sr-provider-api-data
        run: |
          if git diff --quiet -- "$FILE_PATH"; then
            echo "No changes to commit"
            exit 0
          fi

          # Reset (or create) the automated branch to point at main's current
          # tip, so it always carries a single fresh commit.
          BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$REPO/git/refs/heads/$BRANCH" \
              -f sha="$BASE_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null
          fi

          # Commit the new file content via the Contents API,
          # GitHub only auto-verifies commits it creates itself through its API.
          EXISTING_SHA=$(gh api "repos/$REPO/contents/$FILE_PATH?ref=$BRANCH" --jq .sha)
          CONTENT_B64=$(base64 "$FILE_PATH" | tr -d '\n')

          gh api --method PUT "repos/$REPO/contents/$FILE_PATH" \
            -f message="automated: update sr provider api data" \
            -f content="$CONTENT_B64" \
            -f branch="$BRANCH" \
            -f sha="$EXISTING_SHA" >/dev/null

          gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q . || \
          gh pr create \
            --title "automated: update sr provider api data" \
            --body "Automated weekly refresh of the Staking Rewards provider API data." \
            --base main \
            --head "$BRANCH"
